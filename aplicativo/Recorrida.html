<meta charset="utf-8">

<body>
<title>Recorrida Comercial</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --fondo:#F3F4EF; --superficie:#FFFFFF; --superficie2:#ECEEE6;
  --tinta:#1E241D; --tinta2:#5D6554; --borde:#DFE2D6;
  --acento:#2F5D7C; --acento-fondo:#E6EEF3; --acento-tinta:#24485F;
  --ok:#25714F; --ok-fondo:#E1EFE7;
  --warn:#8A6100; --warn-fondo:#F4E9CF;
  --crit:#AC392B; --crit-fondo:#F7E3DF;
  --sombra:0 1px 2px rgba(30,36,29,.06),0 4px 14px rgba(30,36,29,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fondo:#171A14; --superficie:#1F231B; --superficie2:#272C22;
    --tinta:#E9EBE2; --tinta2:#A6AE9A; --borde:#373D30;
    --acento:#8CB6D8; --acento-fondo:#22384A; --acento-tinta:#B3D2E8;
    --ok:#83CBA7; --ok-fondo:#20402F;
    --warn:#E3B968; --warn-fondo:#413418;
    --crit:#E8917F; --crit-fondo:#472319;
    --sombra:0 1px 2px rgba(0,0,0,.25),0 4px 14px rgba(0,0,0,.2);
  }
}
:root[data-theme="dark"]{
  --fondo:#171A14; --superficie:#1F231B; --superficie2:#272C22;
  --tinta:#E9EBE2; --tinta2:#A6AE9A; --borde:#373D30;
  --acento:#8CB6D8; --acento-fondo:#22384A; --acento-tinta:#B3D2E8;
  --ok:#83CBA7; --ok-fondo:#20402F;
  --warn:#E3B968; --warn-fondo:#413418;
  --crit:#E8917F; --crit-fondo:#472319;
  --sombra:0 1px 2px rgba(0,0,0,.25),0 4px 14px rgba(0,0,0,.2);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--fondo); color:var(--tinta);
  font:15px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
a{color:var(--acento);text-decoration:none}
.envoltura{max-width:820px;margin:0 auto;padding-inline:16px}

/* ---- encabezado ---- */
header.tope{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:var(--fondo); border-bottom:1px solid var(--borde);
}
.tope-fila{display:flex;align-items:center;gap:12px;padding-block:10px}
.marca{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;font-weight:700;font-size:21px;letter-spacing:-.01em}
.marca small{display:block;font-family:"Instrument Sans",system-ui,sans-serif;font-weight:500;font-size:11px;color:var(--tinta2);letter-spacing:.04em;text-transform:uppercase}
.vendedor{margin-left:auto;display:flex;align-items:center;gap:6px}
.vendedor label{font-size:11px;color:var(--tinta2);text-transform:uppercase;letter-spacing:.05em}
.vendedor input{
  width:110px;border:1px solid var(--borde);border-radius:999px;background:var(--superficie);
  color:var(--tinta);padding:4px 12px;font:inherit;font-size:13px;font-weight:500;
}
/* ---- navegación ---- */
nav.pestanas{display:flex;gap:2px;background:var(--fondo)}
nav.pestanas a{
  flex:1;text-align:center;padding:9px 4px 11px;color:var(--tinta2);font-weight:500;font-size:13.5px;
  border-bottom:2px solid transparent;
}
nav.pestanas a.activa{color:var(--tinta);border-bottom-color:var(--acento);font-weight:600}
@media (max-width:640px){
  nav.pestanas{
    position:fixed;left:0;right:0;bottom:0;z-index:30;border-top:1px solid var(--borde);
    padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px));background:var(--superficie);
  }
  nav.pestanas a{border-bottom:none;border-radius:9px;padding:8px 4px}
  nav.pestanas a.activa{background:var(--acento-fondo);color:var(--acento-tinta)}
  main{padding-bottom:76px}
}
main{padding-block:16px 32px}

/* ---- avisos ---- */
.aviso{border:1px solid var(--borde);background:var(--superficie2);color:var(--tinta2);
  border-radius:10px;padding:9px 13px;font-size:13.5px;margin-bottom:14px}
.aviso.critico{background:var(--crit-fondo);color:var(--crit);border-color:transparent}

/* ---- tablero ---- */
.tablero{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
@media (max-width:560px){.tablero{grid-template-columns:repeat(2,1fr)}}
.ficha-num{background:var(--superficie);border:1px solid var(--borde);border-radius:12px;padding:10px 12px;display:block;color:var(--tinta)}
.ficha-num b{display:block;font-size:26px;line-height:1.15;font-weight:600;font-variant-numeric:tabular-nums}
.ficha-num span{font-size:12px;color:var(--tinta2)}
.ficha-num.critica b{color:var(--crit)} .ficha-num.alerta b{color:var(--warn)} .ficha-num.activa b{color:var(--acento)}

h2.seccion{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;font-size:16px;font-weight:700;margin:22px 0 10px}
h2.seccion:first-child{margin-top:0}
h2.seccion small{font-family:"Instrument Sans",system-ui,sans-serif;color:var(--tinta2);font-weight:500;font-size:12.5px;margin-left:6px}

/* ---- tarjetas / filas ---- */
.lista{display:flex;flex-direction:column;gap:8px}
.tarjeta{background:var(--superficie);border:1px solid var(--borde);border-radius:12px;padding:11px 14px;box-shadow:var(--sombra)}
.tarjeta.vencida{border-left:3px solid var(--crit)}
.tarjeta.proxima{border-left:3px solid var(--warn)}
a.tarjeta{display:block;color:var(--tinta)}
.fila-titulo{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.fila-titulo b{font-weight:600;font-size:15px}
.fila-titulo .lugar{color:var(--tinta2);font-size:12.5px}
.fila-titulo .puntos{margin-left:auto;font-size:12px;color:var(--tinta2);font-variant-numeric:tabular-nums}
.sub{color:var(--tinta2);font-size:13px;margin-top:3px}
.sub.accion{color:var(--tinta);font-size:13.5px}

.chip{display:inline-block;border-radius:999px;padding:1.5px 9px;font-size:11.5px;font-weight:500;background:var(--superficie2);color:var(--tinta2);vertical-align:1px}
.chip.ok{background:var(--ok-fondo);color:var(--ok)}
.chip.warn{background:var(--warn-fondo);color:var(--warn)}
.chip.crit{background:var(--crit-fondo);color:var(--crit)}
.chip.acento{background:var(--acento-fondo);color:var(--acento-tinta)}

/* ---- controles ---- */
input[type=search],input[type=text],input[type=date],select,textarea{
  width:100%;border:1px solid var(--borde);border-radius:9px;background:var(--superficie);
  color:var(--tinta);padding:8px 11px;font:inherit;font-size:14px;
}
textarea{min-height:64px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{
  outline:2px solid var(--acento);outline-offset:1px}
.filtros{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filtros>input[type=search]{flex:1;min-width:170px}
.filtros>select{width:auto}
button{
  border:1px solid var(--borde);background:var(--superficie);color:var(--tinta);
  border-radius:9px;padding:8px 14px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
}
button.primario{background:var(--acento);border-color:var(--acento);color:#fff}
:root[data-theme="dark"] button.primario{color:#10141A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primario{color:#10141A}}
button.chico{padding:4px 10px;font-size:12.5px;font-weight:500}
button[disabled]{opacity:.5;cursor:default}
.form-grilla{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.form-grilla .ancho{grid-column:1/-1}
@media (max-width:520px){.form-grilla{grid-template-columns:1fr}}
label.campo{display:block;font-size:12px;color:var(--tinta2);font-weight:500}
label.campo>*{margin-top:3px}

/* ---- ficha empresa ---- */
.ficha-cab h1{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;font-size:23px;font-weight:700;margin:2px 0 4px;text-wrap:balance}
.volver{font-size:13px;font-weight:500}
.chips-cab{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.callout{background:var(--acento-fondo);color:var(--acento-tinta);border-radius:12px;padding:11px 14px;font-size:14px;margin-bottom:14px}
.callout b{font-weight:600}
.contacto-fila{display:flex;gap:10px;align-items:flex-start}
.contacto-fila .datos{flex:1;min-width:0}
.contacto-fila .acciones{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:40%}
.linea-tiempo{border-left:2px solid var(--borde);padding-left:14px;display:flex;flex-direction:column;gap:10px}
.evento{position:relative}
.evento::before{content:"";position:absolute;left:-19px;top:6px;width:8px;height:8px;border-radius:99px;background:var(--tinta2)}
.evento.abierta::before{background:var(--warn)}
.evento .cuando{font-size:12px;color:var(--tinta2)}
details.mas{background:var(--superficie);border:1px solid var(--borde);border-radius:12px;padding:10px 14px;margin-top:10px}
details.mas summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--tinta2)}
details.mas dl{margin:8px 0 2px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
details.mas dt{color:var(--tinta2)}
details.mas dd{margin:0;overflow-wrap:anywhere}
.pie-lista{text-align:center;margin-top:12px}
.sin-datos{color:var(--tinta2);font-size:13.5px;padding:8px 2px}
@media (prefers-reduced-motion:no-preference){
  .tarjeta{transition:border-color .15s ease}
}
</style>

  </div>

    <a href="#/contactos" data-ruta="contactos">Contactos</a>
    <a href="#/actividad" data-ruta="actividad">Actividad</a>
  </nav>
</div></header>

inistración","area":"Administración/Finanzas","linkedin":"https://www.linkedin.com/in/diego-porto-68106b75","email":"","conf":"Media","verif":"NO","notas":"Puerta administrativa; RRHH actual sin indexar (Artino Innaria es EX)"}],"propuestas":[{"id":"PROP-0001","emp":"EMP-0297","fecha":"2026-09-22","tipo":"comedor in-company","estado":"borrador","notas":"generada por agente de propuesta; pendiente de revisión humana"},{"id":"PROP-0002","emp":"EMP-0243","fecha":"2026-09-22","tipo":"viandas","estado":"borrador","notas":"generada por agente de propuesta; pendiente de revisión humana"}]};

<script>
"use strict";
/* ================= datos base ================= */
const D = window.DATOS || {empresas:[],contactos:[],propuestas:[],generado:""};
const EMP = new Map(D.empresas.map(e=>[e.id,e]));
const CONTACTOS_EMP = new Map();
for(const c of D.contactos){ if(!CONTACTOS_EMP.has(c.emp)) CONTACTOS_EMP.set(c.emp,[]); CONTACTOS_EMP.get(c.emp).push(c); }
const PROPUESTAS_EMP = new Map();
for(const p of D.propuestas){ if(!PROPUESTAS_EMP.has(p.emp)) PROPUESTAS_EMP.set(p.emp,[]); PROPUESTAS_EMP.get(p.emp).push(p); }

const ESTADOS = ["sin contactar","contactada","en conversación","presupuesto enviado","en licitación","degustación/visita","ganada","perdida","descartada"];
const CERRADOS = new Set(["ganada","perdida","descartada"]);
const TIPOS_ACT = ["llamada","email","whatsapp","linkedin","visita","degustación","propuesta","otro"];

/* ================= estado vivo ================= */
const st = {
  db:null, dbListo:false, soloLectura:false, sinBase:false,
  userId:null, meta:{}, conMeta:{}, acts:[], mcp:null, sync:{ultimo:0, corriendo:false},
  vendedor:"", pendiente:false, canal:"mail", soloNuevas:true, nCamp:30, variante:"A",
  filtros:{ qCuentas:"", fCuentas:"trabajar", oCuentas:"az", nCuentas:60, qCon:"", areaCon:"todas", nCon:80, nAct:60 },
};
try{ st.vendedor = localStorage.getItem("vendedor") || ""; st.sync.ultimo = +(localStorage.getItem("sync_gmail")||0); }catch(_){}

/* ================= utilidades ================= */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = sel => document.querySelector(sel);
function hoyISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function sumarDias(iso,n){ const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseFecha(s){ // ISO | dd/mm/aaaa | dd/mm/aa | m/aa  ->  ISO o null
  s=String(s||"").trim(); if(!s) return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){ const a=m[3].length===2?"20"+m[3]:m[3]; return a+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"); }
  m=s.match(/^(\d{1,2})\/(\d{2})$/);
  if(m && +m[1]>=1 && +m[1]<=12) return "20"+m[2]+"-"+m[1].padStart(2,"0")+"-01";
  return null;
}
function fechaCorta(iso){ if(!iso) return ""; const [a,m,d]=iso.split("-"); return d+"/"+m+(a===String(new Date().getFullYear())?"":"/"+a.slice(2)); }
function nuevoId(pref){ return pref + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

/* ================= estado efectivo de una cuenta ================= */
function estadoDe(e){
  const m = st.meta[e.id];
  if(m && m.estado) return m.estado;
  if(e.excluida) return "descartada";
  const raw=(e.estado_hoja||"").toUpperCase();
  if(/CLIENTE/.test(raw)) return "ganada";
  const rta=(e.respuesta||"").toUpperCase();
  if(/LICITA/.test(raw)) return "en licitación";
  if(/PRESUPUESTO|ENVIA|PRESENTACION|COTIZ/.test(raw)) return "presupuesto enviado";
  if(rta==="SI"||rta==="ACEPTADA"||rta==="ACEPTADO"||/CONVERSACION|REUNION|ARRANCA/.test(raw)) return "en conversación";
  if((e.contactado||"").toUpperCase()==="SI") return "contactada";
  return "sin contactar";
}
function fVolverDe(e){ const m=st.meta[e.id]; return (m&&m.f_volver)||parseFecha(e.f_volver); }
function actsDe(id){ return st.acts.filter(a=>a.emp===id); }
function chipEstado(est){
  const cl = est==="ganada"?"ok" : est==="en conversación"||est==="presupuesto enviado"||est==="en licitación"||est==="degustación/visita"?"acento" : est==="perdida"||est==="descartada"?"crit":"";
  return `<span class="chip ${cl}">${esc(est)}</span>`;
}
function verifDe(c){ const m=st.conMeta[c.id]; return m ? !!m.verificado : c.verif==="SI"; }

/* ================= vencimientos ================= */
function calcularAgenda(){
  const hoy=hoyISO(), limite=sumarDias(hoy,7);
  const vencidas=[], proximas=[];
  const conActAbierta=new Set();
  for(const a of st.acts){
    if(a.estado!=="abierta") continue;
    conActAbierta.add(a.emp);
    if(!a.f_proximo) continue;
    if(a.f_proximo<=hoy) vencidas.push({tipo:"act",fecha:a.f_proximo,a});
    else if(a.f_proximo<=limite) proximas.push({tipo:"act",fecha:a.f_proximo,a});
  }
  for(const e of D.empresas){
    const est=estadoDe(e);
    if(CERRADOS.has(est)||conActAbierta.has(e.id)) continue;
    const fv=fVolverDe(e);
    if(fv && fv<=hoy) vencidas.push({tipo:"volver",fecha:fv,e});
    else if(fv && fv<=limite) proximas.push({tipo:"volver",fecha:fv,e});
  }
  vencidas.sort((x,y)=>x.fecha<y.fecha?-1:1); proximas.sort((x,y)=>x.fecha<y.fecha?-1:1);
  return {vencidas, proximas, conActAbierta};
}

/* ================= render ================= */
function avisos(){
  let h="";
  if(st.modoLocal) h+=`<div class="aviso">Modo local: lo que registres queda guardado en este navegador de esta computadora. Usá "Exportar CSV" (pestaña Actividad) como respaldo o para pasarle los registros a Claude.</div>`;
  else if(st.sinBase) h+=`<div class="aviso">Solo lectura: la base compartida no está disponible en esta vista. Abrí el link desde tu cuenta de claude.ai para registrar actividad.</div>`;
  else if(st.soloLectura) h+=`<div class="aviso">Tu acceso es de solo lectura: podés consultar todo, pero no registrar. Pedile al dueño de la página acceso de edición.</div>`;
  $("#avisos").innerHTML=h;
}

function tarjetaEmpresa(e, sub){
  const est=estadoDe(e);
  const alerta = e.excluida ? `<span class="chip crit">${esc(e.excluida)}</span>` : (e.alerta?`<span class="chip warn">⚠ ${esc(e.alerta.slice(0,38))}</span>`:"");
  return `<a class="tarjeta" href="#/cuenta/${e.id}">
    <div class="fila-titulo"><b>${esc(e.nombre)}</b>
      ${e.localidad?`<span class="lugar">${esc(e.localidad)}</span>`:""}</div>
    <div class="sub">${chipEstado(est)} ${alerta} ${e.tam?`<span class="chip">~${esc(e.tam.replace(/^~+/,"").slice(0,22))}</span>`:""}</div>
    ${sub?`<div class="sub accion">${sub}</div>`:""}
  </a>`;
}

function vistaHoy(){
  const {vencidas, proximas, conActAbierta}=calcularAgenda();
  const enConv=D.empresas.filter(e=>["en conversación","presupuesto enviado","en licitación","degustación/visita"].includes(estadoDe(e)));
  const hace7=sumarDias(hoyISO(),-7);
  const actsSemana=st.acts.filter(a=>(a.f||"")>=hace7).length;
  const enAgenda=new Set([...vencidas,...proximas].map(v=>v.tipo==="act"?v.a.emp:v.e.id));
  const cola=D.empresas.filter(e=>!e.excluida && !CERRADOS.has(estadoDe(e)) && !conActAbierta.has(e.id) && !enAgenda.has(e.id)
      && (CONTACTOS_EMP.get(e.id)||[]).some(c=>c.area==="Compras"||c.area==="RRHH"))
    .sort((a,b)=>b.score-a.score).slice(0,10);
  const pendCamp=pendientesCampana("mail").length;

  let h=`<div class="tablero">
    <a class="ficha-num ${vencidas.length?"critica":""}" href="#/hoy"><b>${vencidas.length}</b><span>vencidas</span></a>
    <a class="ficha-num ${proximas.length?"alerta":""}" href="#/hoy"><b>${proximas.length}</b><span>próx. 7 días</span></a>
    <a class="ficha-num activa" href="#/cuentas"><b>${enConv.length}</b><span>en conversación</span></a>
    <a class="ficha-num" href="#/actividad"><b>${actsSemana}</b><span>actividades, 7 días</span></a>
  </div>`;

  if(pendCamp) h+=`<a class="callout" style="display:block" href="#/campana"><b>Campaña de contacto inicial:</b> ${pendCamp} cuentas con mail sin primer contacto — registro →</a>`;

  h+=`<h2 class="seccion">Para hoy <small>seguimientos vencidos</small></h2><div class="lista">`;
  if(!vencidas.length) h+=`<div class="sin-datos">Nada vencido. ✔</div>`;
  for(const v of vencidas.slice(0,25)){
    if(v.tipo==="act"){ const e=EMP.get(v.a.emp)||{nombre:v.a.emp,id:v.a.emp};
      h+=`<div class="tarjeta vencida"><div class="fila-titulo"><b><a href="#/cuenta/${e.id}">${esc(e.nombre)}</a></b><span class="puntos">venció ${fechaCorta(v.fecha)}</span></div>
        <div class="sub accion">${esc(v.a.proximo||v.a.resumen||"seguimiento")} <span class="chip">${esc(v.a.tipo||"")}</span></div>
        <div class="sub" style="margin-top:6px"><button class="chico" data-action="act-hecha" data-id="${v.a.id}">Marcar hecho</button></div></div>`;
    }else{
      h+=tarjetaEmpresa(v.e, `Retomar contacto (estaba para ${fechaCorta(v.fecha)})`);
    }
  }
  h+=`</div>`;
  if(proximas.length){
    h+=`<h2 class="seccion">Próximos 7 días</h2><div class="lista">`;
    for(const v of proximas.slice(0,15)){
      const e=v.tipo==="act"?(EMP.get(v.a.emp)||{nombre:v.a.emp,id:v.a.emp}):v.e;
      const txt=v.tipo==="act"?(v.a.proximo||v.a.resumen||"seguimiento"):"volver a contactar";
      h+=`<a class="tarjeta proxima" href="#/cuenta/${e.id}"><div class="fila-titulo"><b>${esc(e.nombre)}</b><span class="puntos">${fechaCorta(v.fecha)}</span></div><div class="sub">${esc(txt)}</div></a>`;
    }
    h+=`</div>`;
  }
  h+=`<h2 class="seccion">Sugeridas para arrancar <small>con decisor identificado y nada pendiente</small></h2><div class="lista">`;
  for(const e of cola) h+=tarjetaEmpresa(e, esc(e.accion||""));
  h+=`</div>`;
  return h;
}

function vistaCuentas(){
  const f=st.filtros;
  let lista=D.empresas.slice();
  const q=f.qCuentas.trim().toLowerCase();
  if(q) lista=lista.filter(e=>(e.nombre+" "+e.localidad+" "+e.obs+" "+e.hist).toLowerCase().includes(q));
  const est=e=>estadoDe(e);
  if(f.fCuentas==="trabajar") lista=lista.filter(e=>!e.excluida&&!CERRADOS.has(est(e)));
  else if(f.fCuentas==="conversacion") lista=lista.filter(e=>["en conversación","presupuesto enviado","en licitación","degustación/visita"].includes(est(e)));
  else if(f.fCuentas==="sincontactar") lista=lista.filter(e=>est(e)==="sin contactar"&&!e.excluida);
  else if(f.fCuentas==="cerradas") lista=lista.filter(e=>CERRADOS.has(est(e))||e.excluida);
  if(f.oCuentas==="sugeridas") lista.sort((a,b)=>b.score-a.score);
  else lista.sort((a,b)=>a.nombre.localeCompare(b.nombre,"es",{sensitivity:"base"}));

  let h=`<div class="filtros">
    <input type="search" id="q-cuentas" placeholder="Buscar cuenta, localidad…" value="${esc(f.qCuentas)}">
    <select id="f-cuentas">
      <option value="trabajar" ${f.fCuentas==="trabajar"?"selected":""}>Para trabajar</option>
      <option value="conversacion" ${f.fCuentas==="conversacion"?"selected":""}>En conversación</option>
      <option value="sincontactar" ${f.fCuentas==="sincontactar"?"selected":""}>Sin contactar</option>
      <option value="cerradas" ${f.fCuentas==="cerradas"?"selected":""}>Cerradas / excluidas</option>
      <option value="todas" ${f.fCuentas==="todas"?"selected":""}>Todas</option>
    </select>
    <select id="o-cuentas">
      <option value="az" ${f.oCuentas==="az"?"selected":""}>A – Z</option>
      <option value="sugeridas" ${f.oCuentas==="sugeridas"?"selected":""}>Sugeridas primero</option>
    </select></div>
    <div class="sub" style="margin-bottom:10px">${lista.length} cuentas</div><div class="lista">`;
  for(const e of lista.slice(0,f.nCuentas)) h+=tarjetaEmpresa(e, esc(e.accion||""));
  h+=`</div>`;
  if(lista.length>f.nCuentas) h+=`<div class="pie-lista"><button data-action="mas-cuentas">Mostrar más (${lista.length-f.nCuentas})</button></div>`;
  return h;
}

function vistaContactos(){
  const f=st.filtros;
  let lista=D.contactos.slice();
  const q=f.qCon.trim().toLowerCase();
  if(q) lista=lista.filter(c=>(c.nombre+" "+c.cargo+" "+(EMP.get(c.emp)||{}).nombre).toLowerCase().includes(q));
  if(f.areaCon==="compras") lista=lista.filter(c=>c.area==="Compras");
  else if(f.areaCon==="rrhh") lista=lista.filter(c=>c.area==="RRHH");
  else if(f.areaCon==="direccion") lista=lista.filter(c=>c.area==="Dirección/Dueño");
  else if(f.areaCon==="verificados") lista=lista.filter(c=>verifDe(c));

  let h=`<div class="filtros">
    <input type="search" id="q-con" placeholder="Buscar persona, cargo, empresa…" value="${esc(f.qCon)}">
    <select id="f-con">
      <option value="todas" ${f.areaCon==="todas"?"selected":""}>Todas las áreas</option>
      <option value="compras" ${f.areaCon==="compras"?"selected":""}>Compras</option>
      <option value="rrhh" ${f.areaCon==="rrhh"?"selected":""}>RRHH</option>
      <option value="direccion" ${f.areaCon==="direccion"?"selected":""}>Dirección/Dueño</option>
      <option value="verificados" ${f.areaCon==="verificados"?"selected":""}>Verificados</option>
    </select></div>
    <div class="sub" style="margin-bottom:10px">${lista.length} contactos</div><div class="lista">`;
  for(const c of lista.slice(0,f.nCon)) h+=tarjetaContacto(c,true);
  h+=`</div>`;
  if(lista.length>f.nCon) h+=`<div class="pie-lista"><button data-action="mas-contactos">Mostrar más (${lista.length-f.nCon})</button></div>`;
  return h;
}

function tarjetaContacto(c, conEmpresa){
  const e=EMP.get(c.emp);
  const verif=verifDe(c);
  const acciones=[
    c.email?`<a class="chip acento" href="mailto:${esc(c.email)}">mail</a>`:"",
    (c.linkedin||"").startsWith("http")?`<a class="chip acento" href="${esc(c.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>`:"",
    `<button class="chico" data-action="verif" data-id="${c.id}" data-val="${verif?0:1}" ${st.soloLectura||st.sinBase?"disabled":""}>${verif?"✓ verificado":"marcar verificado"}</button>`,
  ].join(" ");
  return `<div class="tarjeta"><div class="contacto-fila"><div class="datos">
    <div class="fila-titulo"><b>${esc(c.nombre)}</b>${verif?`<span class="chip ok">✓</span>`:`<span class="chip">${esc(c.conf||"s/d")}</span>`}</div>
    <div class="sub">${esc(c.cargo)} · <span class="chip">${esc(c.area)}</span></div>
    ${conEmpresa&&e?`<div class="sub"><a href="#/cuenta/${e.id}">${esc(e.nombre)}</a></div>`:""}
    ${c.notas?`<div class="sub">${esc(c.notas.slice(0,120))}</div>`:""}
  </div><div class="acciones">${acciones}</div></div></div>`;
}

function vistaCuenta(id){
  const e=EMP.get(id);
  if(!e) return `<div class="aviso">No existe la cuenta ${esc(id)}.</div>`;

  const acts=actsDe(id).sort((a,b)=>(b.ts||0)-(a.ts||0));

  const deshab = st.soloLectura||st.sinBase ? "disabled" : "";

  let h=`<div class="ficha-cab">

    <div class="chips-cab">${chipEstado(est)}
      ${e.localidad?`<span class="chip">${esc(e.localidad)}</span>`:""}
      ${e.prioridad?`<span class="chip">P${esc(e.prioridad)}</span>`:""}
      ${e.tam?`<span class="chip">~${esc(e.tam.replace(/^~+/,"").slice(0,26))}</span>`:""}
      ${e.alerta||e.excluida?`<span class="chip ${e.excluida?"crit":"warn"}">⚠ ${esc(e.excluida||e.alerta)}</span>`:""}
    </div></div>`;
  if(e.accion) h+=`<div class="callout"><b>Sugerido:</b> ${esc(e.accion)}</div>`;

  h+=`<h2 class="seccion">Estado</h2><form class="tarjeta" data-form="estado" data-id="${id}"><div class="form-grilla">
    <label class="campo">Estado

/* ================= campaña de contacto inicial ================= */
const CANALES={mail:"email", linkedin:"linkedin"};
function extraerMail(s){ const m=String(s||"").match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/); return m?m[0]:null; }
function esEx(c){
  const cargo=String(c.cargo||"").trim().toUpperCase(), notas=String(c.notas||"").toUpperCase();
  return /^EX[\s\-]/.test(cargo) || /POSIBLE EX|EX\?|¿EX|YA NO EST/.test(cargo+" "+notas);
}
function rankCon(c){
  let p=0;
  if(c.area==="Compras"||c.area==="RRHH") p+=40; else if(c.area==="Dirección/Dueño") p+=20; else p+=10;
  const cf=c.conf||""; if(cf.startsWith("Alta")) p+=15; else if(cf.startsWith("Media-Alta")) p+=10; else if(cf.startsWith("Media")) p+=5;
  if(c.email) p+=12; if((c.linkedin||"").startsWith("http")) p+=8;
  if(esEx(c)) p-=60;
  return p;
}
function contactoCanal(e, canal){
  const lista=(CONTACTOS_EMP.get(e.id)||[]).filter(c=>!esEx(c)).sort((a,b)=>rankCon(b)-rankCon(a));
  if(canal==="mail") return lista.find(c=>c.email)||null;
  if(canal==="linkedin") return lista.find(c=>(c.linkedin||"").startsWith("http"))||null;
  return null;
}
function destinoCanal(e, canal){
  if(canal==="mail"){ const c=contactoCanal(e,"mail"); return c?extraerMail(c.email):extraerMail(e.mail); }
  if(canal==="linkedin"){ const c=contactoCanal(e,"linkedin"); return c?c.linkedin:null; }
  return null;
}
function chkDe(e, dest){ return (e.chk_dest && dest && e.chk_dest.toLowerCase()===String(dest).toLowerCase()) ? e.chk : ""; }
function pendientesCampana(canal){
  const tipo=CANALES[canal];
  const yaPorCanal=new Set(), conAlguna=new Set(), destUsados=new Set();
  for(const a of st.acts){ conAlguna.add(a.emp); if(a.tipo===tipo) yaPorCanal.add(a.emp); }
  const orden={ok:0, "":1, gen:1, rev:2};
  return D.empresas.filter(e=>{
    if(e.excluida||CERRADOS.has(estadoDe(e))) return false;
    if(!destinoCanal(e,canal)) return false;
    if(yaPorCanal.has(e.id)) return false;
    const m=st.meta[e.id]||{};
    if(m["omitida_"+canal]) return false;
    if(st.soloNuevas && (conAlguna.has(e.id) || (e.contactado||"").toUpperCase()==="SI")) return false;
    return true;
  }).sort((a,b)=>{
    if(canal==="mail"){
      const d=orden[chkDe(a,destinoCanal(a,"mail"))]-orden[chkDe(b,destinoCanal(b,"mail"))];
      if(d) return d;
    }
    return b.score-a.score;
  }).filter(e=>{
    if(canal!=="mail") return true;
    const dest=String(destinoCanal(e,"mail")).toLowerCase();
    if(destUsados.has(dest)) return false;   // misma casilla que otra cuenta: se manda una sola vez
    destUsados.add(dest); return true;
  });
}
function enviadosCampana(canal){
  const tipo=CANALES[canal];
  return st.acts.filter(a=>a.campana&&a.tipo===tipo).length;
}
function vistaCampana(){
  const canal=st.canal;
  const deshab = st.soloLectura||st.sinBase ? "disabled" : "";
  const pend={mail:pendientesCampana("mail"),linkedin:pendientesCampana("linkedin")};
  const lista=pend[canal];

  let h=`<div class="filtros">
    <select id="canal-camp">
      <option value="mail" ${canal==="mail"?"selected":""}>✉️ Mail (${pend.mail.length} sin contactar)</option>
      <option value="linkedin" ${canal==="linkedin"?"selected":""}>💼 LinkedIn (${pend.linkedin.length})</option>
    </select>
    <label class="campo" style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="solo-nuevas" ${st.soloNuevas?"checked":""} style="width:auto"> solo cuentas nunca contactadas</label>
    ${st.mcp?`<button data-action="sync-gmail">🔄 Sincronizar con Gmail</button>`:""}
  </div>
  <div class="sub" style="margin-bottom:12px">Registro de la campaña de contacto inicial. Los mensajes se preparan y envían por fuera (Gmail); acá solo se deja asentado: <b>✓ Enviado</b> registra la actividad con seguimiento a 7 días, <b>Omitir</b> saca la cuenta de la lista. ${enviadosCampana(canal)} enviados por este canal.${st.mcp?` Conectado a Gmail: al sincronizar, los mails que salieron de comercial@ se registran solos${st.sync.ultimo?` (última vez ${fechaCorta(new Date(st.sync.ultimo).toISOString().slice(0,10))})`:""}.`:""}</div>`;

  h+=`<div class="lista">`;
  for(const e of lista.slice(0,st.nCamp)){
    const c=contactoCanal(e,canal);
    const dest=destinoCanal(e,canal);
    let quien, sello="";
    if(canal==="mail"){
      const k=chkDe(e,dest);
      sello = k==="ok"?`<span class="chip ok">✓ verificado</span>` : k==="rev"?`<span class="chip crit">⚠ ${esc(e.chk_motivo||"revisar destinatario")}</span>` : `<span class="chip warn">casilla genérica</span>`;
      quien=(c?`${esc(c.nombre)} — ${esc(c.cargo.slice(0,40))}`:`casilla institucional`)+` · <span style="overflow-wrap:anywhere">${esc(dest)}</span>`;
    }else{
      quien=`${esc(c.nombre)} — ${esc(c.cargo.slice(0,40))}`;
    }
    h+=`<div class="tarjeta" data-emp="${e.id}">
      <div class="fila-titulo"><b><a href="#/cuenta/${e.id}">${esc(e.nombre)}</a></b>${e.localidad?`<span class="lugar">${esc(e.localidad)}</span>`:""}</div>
      <div class="sub">→ ${quien} ${sello}</div>
      <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
        <button class="chico" data-action="camp-enviado" data-emp="${e.id}" ${deshab}>✓ Enviado</button>
        <button class="chico" data-action="camp-omitir" data-emp="${e.id}" ${deshab}>Omitir</button>
      </div></div>`;
  }
  h+=`</div>`;
  if(!lista.length) h+=`<div class="sin-datos">No queda ninguna cuenta sin contactar por este canal. 🎉</div>`;
  if(lista.length>st.nCamp) h+=`<div class="pie-lista"><button data-action="mas-camp">Mostrar más (${lista.length-st.nCamp})</button></div>`;
  return h;
}
function registrarEnvioCampana(e){
  const canal=st.canal, tipo=CANALES[canal], c=contactoCanal(e,canal);
  const quien=c?c.nombre:(canal==="mail"?"casilla institucional":"tel "+e.tel);
  return st.db.collection("actividades").doc(nuevoId("a")).set({
    emp:e.id, con:c?c.id:null, tipo, campana:true,
    resumen:"Contacto inicial (campaña) por "+canal+" a "+quien,
    proximo:"seguimiento si no responde", f_proximo:sumarDias(hoyISO(),7),
    estado:"abierta", por:st.vendedor, por_id:st.userId, f:hoyISO(), ts:Date.now(),
  });
}
/* ================= sincronización con Gmail (conector del que mira la página) ================= */
async function sincronizarGmail(btn, silencioso){
  if(!st.mcp || !st.db || st.sync.corriendo) return;
  st.sync.corriendo = true;
  if(btn){ btn.disabled=true; btn.textContent="Sincronizando…"; }
  let detectados = 0;
  try{
    const conEmail = new Set(st.acts.filter(a=>a.tipo==="email").map(a=>a.emp));
    const mapa = new Map();
    for(const e of D.empresas){
      if(e.excluida || CERRADOS.has(estadoDe(e)) || conEmail.has(e.id)) continue;
      const dest = destinoCanal(e, "mail");
      if(dest && !mapa.has(dest.toLowerCase())) mapa.set(dest.toLowerCase(), e);
    }
    let token = "", paginas = 0;
    while(paginas < 5){
      const input = { query: "in:sent newer_than:60d", pageSize: 50, view: "THREAD_VIEW_METADATA_ONLY" };
      if(token) input.pageToken = token;
      const res = await st.mcp.callTool("Gmail", "search_threads", input, { cache: false });
      const pl = (res && res.payload) || {};
      const hilos = pl.threads || [];
      for(const h of hilos) for(const m of (h.messages || [])){
        if(!((m.labelIds || []).includes("SENT"))) continue;
        for(const to of (m.toRecipients || [])){
          const e = mapa.get(String(to).toLowerCase());
          if(!e) continue;
          mapa.delete(String(to).toLowerCase());
          const c = contactoCanal(e, "mail");
          const f = String(m.date || "").slice(0, 10) || hoyISO();
          await st.db.collection("actividades").doc(nuevoId("a")).set({
            emp: e.id, con: c ? c.id : null, tipo: "email", campana: true, auto: true,
            resumen: "Mail enviado desde Gmail (detectado automáticamente)",
            proximo: "seguimiento si no responde", f_proximo: sumarDias(f, 7),
            estado: "abierta", por: st.vendedor || "Gmail", por_id: st.userId, f: f, ts: Date.now(),
          });
          detectados++;
        }
      }
      token = pl.nextPageToken || ""; paginas++;
      if(!token || !hilos.length) break;
    }
    st.sync.ultimo = Date.now();
    try{ localStorage.setItem("sync_gmail", String(st.sync.ultimo)); }catch(_){}
    render();
    if(detectados) alertaTemporal("Sincronizado con Gmail: " + detectados + (detectados===1 ? " envío nuevo registrado." : " envíos nuevos registrados."), "ok");
    else if(!silencioso) alertaTemporal("Sincronizado con Gmail: sin envíos nuevos para registrar.", "ok");
  }catch(err){
    const c = err && err.code;
    if(!silencioso){
      if(c === "server_not_connected") alertaTemporal("Gmail no está conectado. Agregalo en claude.ai → Configuración → Conectores y volvé a intentar.");
      else if(c === "needs_reauth") alertaTemporal("Hay que reconectar Gmail: claude.ai → Configuración → Conectores → Gmail.");
      else if(c === "not_in_manifest") alertaTemporal("No autorizaste Gmail para esta página. Tocá Sincronizar de nuevo y aceptá el permiso.");
      else if(c === "selection_required") alertaTemporal("Tenés más de un conector Gmail: elegí uno cuando la página lo pregunte y reintentá.");
      else alertaTemporal("No se pudo sincronizar con Gmail" + (c ? " (" + c + ")" : "") + ". Probá de nuevo en un rato.");
    }
    console.error(err);
  }finally{
    st.sync.corriendo = false;
    if(btn){ btn.disabled=false; btn.textContent="🔄 Sincronizar con Gmail"; }
  }
}
function autoSyncCampana(){
  if(!st.mcp || st.sync.corriendo) return;
  if(Date.now() - st.sync.ultimo < 10*60*1000) return;
  window.claude.use("permissions").then(perm=>{
    if(!perm) return;
    Promise.resolve(perm.state("mcp:Gmail")).then(estado=>{
      if(estado === "granted") sincronizarGmail(null, true);
    }).catch(()=>{});
  }).catch(()=>{});
}

/* ================= router ================= */
function ruta(){ return location.hash.replace(/^#\/?/,"") || "hoy"; }
function render(){
  st.pendiente=false;
  const r=ruta().split("/");
  const vista=$("#vista");
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("activa", a.dataset.ruta===r[0]||(r[0]==="cuenta"&&a.dataset.ruta==="cuentas")));
  avisos();
  if(r[0]==="cuenta"&&r[1]) vista.innerHTML=vistaCuenta(r[1]);
  else if(r[0]==="cuentas") vista.innerHTML=vistaCuentas();
  else if(r[0]==="contactos") vista.innerHTML=vistaContactos();
  else if(r[0]==="campana"){ vista.innerHTML=vistaCampana(); autoSyncCampana(); }
  else if(r[0]==="actividad") vista.innerHTML=vistaActividad();
  else vista.innerHTML=vistaHoy();
}
function scheduleRender(){
  const ae=document.activeElement;
  if(ae && $("#vista") && $("#vista").contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){ st.pendiente=true; return; }
  render();
}
window.addEventListener("hashchange",()=>{ render(); window.scrollTo(0,0); });
document.addEventListener("focusout",()=>{ if(st.pendiente) setTimeout(()=>{ if(st.pendiente) scheduleRender(); },200); });

/* ================= acciones ================= */
function marcarSoloLectura(){ st.soloLectura=true; avisos(); }
async function escribir(fn, btn){
  if(btn){ btn.disabled=true; }
  try{ await fn(); }
  catch(err){
    if(err && err.code==="invalid_argument"){ marcarSoloLectura(); }
    else if(err && err.code==="quota_exceeded"){ alertaTemporal("La base llegó a su límite de registros. Exportá y avisale a Claude para archivar."); }
    else{ alertaTemporal("No se pudo guardar. Probá de nuevo."); }
    console.error(err);
  }
  finally{ if(btn){ btn.disabled=false; } }
}
function alertaTemporal(msg, tipo){
  const div=document.createElement("div"); div.className=tipo==="ok"?"aviso":"aviso critico"; div.textContent=msg;
  $("#avisos").appendChild(div); setTimeout(()=>div.remove(),7000);
}

document.addEventListener("click", ev=>{
  const b=ev.target.closest("[data-action]");
  if(!b) return;
  const acc=b.dataset.action;
  if(acc==="mas-cuentas"){ st.filtros.nCuentas+=80; render(); }
  else if(acc==="mas-contactos"){ st.filtros.nCon+=80; render(); }
  else if(acc==="mas-acts"){ st.filtros.nAct+=80; render(); }
  else if(acc==="act-hecha"&&st.db){ escribir(()=>st.db.collection("actividades").doc(b.dataset.id).update({estado:"cerrada"}).then(render), b); }
  else if(acc==="verif"&&st.db){
    const id=b.dataset.id, val=b.dataset.val==="1";
    escribir(()=>st.db.collection("contactos_meta").doc(id).set({verificado:val,por:st.vendedor,por_id:st.userId,f:hoyISO(),ts:Date.now()}).then(render), b);
  }
  else if(acc==="exportar"){ exportarCSV(b); }
  else if(acc==="mas-camp"){ st.nCamp+=40; render(); }
  else if(acc==="sync-gmail"){ sincronizarGmail(b, false); }
  else if(acc==="camp-enviado"&&st.db){ const e=EMP.get(b.dataset.emp); if(e) escribir(()=>registrarEnvioCampana(e).then(render), b); }
  else if(acc==="camp-omitir"&&st.db){
    const e=EMP.get(b.dataset.emp); if(!e) return;
    const m=Object.assign({}, st.meta[e.id]||{});
    m["omitida_"+st.canal]=true; m.por=st.vendedor; m.ts=Date.now();
    escribir(()=>st.db.collection("cuentas_meta").doc(e.id).set(m).then(render), b);
  }
});

document.addEventListener("submit", ev=>{
  const form=ev.target.closest("form[data-form]");
  if(!form) return;
  ev.preventDefault();
  if(!st.db){ alertaTemporal("La base compartida no está disponible."); return; }
  const id=form.dataset.id, fd=new FormData(form);
  const btn=form.querySelector("button.primario");
  if(form.dataset.form==="estado"){
    escribir(()=>st.db.collection("cuentas_meta").doc(id).set({
      estado:fd.get("estado"), f_volver:fd.get("f_volver")||null, nota:fd.get("nota")||"",
      por:st.vendedor, por_id:st.userId, f:hoyISO(), ts:Date.now(),
    }).then(render), btn);
  }else if(form.dataset.form==="actividad"){
    if(!String(fd.get("resumen")||"").trim()){ alertaTemporal("Contá qué pasó antes de registrar."); return; }
    const abierta=!!fd.get("abierta");
    escribir(()=>st.db.collection("actividades").doc(nuevoId("a")).set({
      emp:id, con:fd.get("con")||null, tipo:fd.get("tipo"),
      resumen:String(fd.get("resumen")).trim(), proximo:String(fd.get("proximo")||"").trim(),
      f_proximo:abierta?(fd.get("f_proximo")||sumarDias(hoyISO(),7)):null,
      estado:abierta?"abierta":"cerrada",
      por:st.vendedor, por_id:st.userId, f:hoyISO(), ts:Date.now(),
    }).then(render), btn);
  }
});

  else if(t.id==="f-con"){ st.filtros.areaCon=t.value; st.filtros.nCon=80; render(); }
  else if(t.id==="canal-camp"){ st.canal=t.value; st.nCamp=30; render(); }
  else if(t.id==="solo-nuevas"){ st.soloNuevas=t.checked; st.nCamp=30; render(); }
  else if(t.id==="vendedor"){ st.vendedor=t.value.trim(); try{localStorage.setItem("vendedor",st.vendedor);}catch(_){} }
});
function refrescarLista(vistaFn, focoId){
  const foco=document.getElementById(focoId); const pos=foco?foco.selectionStart:0;
  $("#vista").innerHTML=vistaFn();
  const nuevo=document.getElementById(focoId);
  if(nuevo){ nuevo.focus(); try{nuevo.setSelectionRange(pos,pos);}catch(_){} }
}

async function exportarCSV(btn){
  const cab=["id","fecha","empresa_id","empresa","contacto_id","tipo","resumen","proximo_paso","fecha_proximo","estado","por"];
  const filas=st.acts.map(a=>[a.id,a.f,a.emp,(EMP.get(a.emp)||{}).nombre||"",a.con||"",a.tipo,a.resumen,a.proximo||"",a.f_proximo||"",a.estado,a.por||""]);
  const csv="﻿"+[cab,...filas].map(f=>f.map(v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",")).join("\n");
  const nombre="actividades_"+hoyISO()+".csv";
  if(st.modoLocal){ descargaDirecta(nombre,csv); return; }
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
  if(!dl){ alertaTemporal("La descarga no está disponible en esta vista."); return; }
  btn.disabled=true;
  try{ await dl.save({filename:nombre, data:csv}); }
  catch(err){ if(err&&err.code!=="declined") alertaTemporal("No se pudo exportar."); }
  finally{ btn.disabled=false; }
}

/* ================= base local (archivo abierto directo, sin claude.ai) ================= */
function crearBaseLocal(){
  const CLAVE="recorrida_db";
  let datos={actividades:{},cuentas_meta:{},contactos_meta:{}};
  try{ const g=localStorage.getItem(CLAVE); if(g) datos=Object.assign(datos,JSON.parse(g)); }catch(_){}
  const oyentes=[];
  function guardar(){ try{ localStorage.setItem(CLAVE,JSON.stringify(datos)); }catch(_){} }
  function snap(col){ return {docs:Object.entries(datos[col]||{}).map(([id,d])=>({id, data:()=>d}))}; }
  function avisar(col){ for(const o of oyentes) if(o.col===col) o.cb(snap(col)); }
  function coleccion(col){
    datos[col]=datos[col]||{};
    const q={
      orderBy:()=>q, limit:()=>q,
      onSnapshot:(cb)=>{ oyentes.push({col,cb}); cb(snap(col)); return ()=>{}; },
      doc:(id)=>({
        set:async d=>{ datos[col][id]=d; guardar(); avisar(col); },
        update:async d=>{ if(!datos[col][id]) throw {code:"invalid_argument",message:"no existe"}; Object.assign(datos[col][id],d); guardar(); avisar(col); },
      }),
    };
    return q;
  }
  return {collection:coleccion, local:true};
}
function descargaDirecta(nombre, contenido){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([contenido],{type:"text/csv"}));
  a.download=nombre; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},400);
}

/* ================= arranque ================= */
function suscribir(db){
  db.collection("actividades").orderBy("ts","desc").limit(500).onSnapshot(s=>{
    st.acts=s.docs.map(d=>Object.assign({id:d.id}, d.data()));
    st.dbListo=true; scheduleRender();
  }, e=>{ console.error(e); if(e.code==="revoked"){ st.sinBase=true; avisos(); } });
  db.collection("cuentas_meta").onSnapshot(s=>{
    const m={}; for(const d of s.docs) m[d.id]=d.data();
    st.meta=m; scheduleRender();
  }, e=>console.error(e));
  db.collection("contactos_meta").onSnapshot(s=>{
    const m={}; for(const d of s.docs) m[d.id]=d.data();
    st.conMeta=m; scheduleRender();
  }, e=>console.error(e));
}
function conectar(){
  if(!window.claude || typeof window.claude.use!=="function"){
    st.db=crearBaseLocal(); st.modoLocal=true; suscribir(st.db); avisos(); return;
  }
  window.claude.use("db").then(db=>{
    if(!db){ st.sinBase=true; avisos(); return; }
    st.db=db;
    suscribir(db);
  });
  window.claude.use("mcp").then(m=>{ st.mcp=m; if(m) scheduleRender(); });
  window.claude.use("user").then(async u=>{
    if(!u) return;
    try{
      const puede=await u.can("data.write");
      if(puede===false){ marcarSoloLectura(); render(); }
      st.userId=await u.id();
      if(!st.vendedor){ const me=await u.me(); if(me.name){ st.vendedor=me.name; const inp=$("#vendedor"); if(inp) inp.value=me.name; try{localStorage.setItem("vendedor",st.vendedor);}catch(_){} } }
    }catch(err){ console.error(err); }
  });
}
$("#vendedor").value=st.vendedor;
render();
conectar();
</script>
